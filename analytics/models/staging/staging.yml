
models:
  - name: stg_job_postings
    description: >
      One row per job posting per scrape day.
      A job re-scraped across different days keeps every row.

    columns:
      - name: job_id
        description: Unique identifier for each job posting.
        data_tests:
          - not_null

      - name: job_title
        description: Title of the job posting.

      - name: job_description
        description: Description of the job posting.

      - name: company_name
        description: Name of the company posting the job.

      - name: location
        description: Location of the job posting.

      - name: posted_date
        description: Date the job was posted.

      - name: scrape_date
        description: Date the job posting was scraped.

      - name: searched_at
        description: Date or relative time when the job was originally posted.

      - name: job_salary
        description: Advertised salary or salary range for the job.

      - name: salary_min
        description: Minimum salary advertised for the job posting.
        data_tests:
          - non_negative

      - name: salary_max
        description: Maximum salary advertised for the job posting.
        data_tests:
          - non_negative

      - name: salary_avg
        description: Average salary calculated from the minimum and maximum salary.

      - name: job_schedule_type
        description: Employment schedule such as full-time, part-time, or contract.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Part-time','Full-time','Contractor','Internship']
              config:
                severity: warn
      - name: is_remote
        description: Indicates whether the job allows remote work.

      - name: has_no_degree_mentioned
        description: Indicates whether the job posting mentions that no degree is required.

      - name: has_paid_time_off
        description: Indicates whether the job posting offers paid time off.

      - name: has_dental_insurance
        description: Indicates whether the job posting offers dental insurance.

      - name: has_health_insurance
        description: Indicates whether the job posting offers health insurance.

      - name: search_time
        description: Timestamp when the job search was executed.

      - name: search_date
        description: Date when the job search was executed.

      - name: search_term
        description: Keyword or phrase used to search for job postings.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Data Engineer','Data Analyst','Data Scientist']
      - name: search_location
        description: Location parameter used during the job search.

  - name: stg_job_skills
    description: >
      Staging model for raw job skills data.
      Cleans skill keywords by trimming leading and trailing whitespace.
      One row per job and associated skill.

    columns:
      - name: job_id
        description: Unique identifier for each job posting.

      - name: skill_id
        description: Unique identifier for each skill.

      - name: skill_keyword
        description: Skill keyword associated with the job posting, with leading and trailing whitespace removed.

unit_tests:
  - name: test_parse_salary_shape
    description: >
      Tests salary parsing for a salary range,
      a single salary value, and missing salary.

    model: stg_job_postings

    given:
      - input: source('jobs', 'raw_job_postings')
        rows:
          - {job_id: 1, job_salary: "100k–186k a year"}
          - {job_id: 2, job_salary: "32.50 an hour"}
          - {job_id: 3, job_salary: "null"}

    expect:
      rows:
        - {job_id: 1, salary_min: 100000, salary_max: 186000}
        - {job_id: 2, salary_min: 32.50, salary_max: 32.50}
        - {job_id: 3, salary_min: null, salary_max: null}
